name: bluegrass_client
description: BlueGrass Windows client
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  bluegrass_domain:
    path: ../packages/domain
  bluegrass_data_source:
    path: ../packages/data_source
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/wordmark-light.png
    - assets/branding/wordmark-dark.png
    - assets/LICENSE.Xray-core
    - assets/LICENSE.wintun
    - assets/LICENSE.sing
