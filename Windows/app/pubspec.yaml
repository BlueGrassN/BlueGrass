name: bluegrass_windows
description: Windows host for the shared BlueGrass client
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  bluegrass_client:
    path: ../../packages/client
  flutter:
    sdk: flutter
  bluegrass_domain:
    path: ../../packages/domain
  bluegrass_data_source:
    path: ../../packages/data_source
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
# Flutter 3.47.9 still pins older releases. Keep these exact overrides in
# sync with Mac/app; recheck the full regression suites on SDK upgrades.
dependency_overrides:
  material_color_utilities: 0.13.1
  test_api: 0.7.15
flutter:
  uses-material-design: true
  assets:
    - assets/branding/wordmark-light.png
    - assets/branding/wordmark-dark.png
    - assets/LICENSE.Xray-core
    - assets/LICENSE.wintun
    - assets/LICENSE.sing
