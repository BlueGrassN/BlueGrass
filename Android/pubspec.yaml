name: client
description: BlueGrass Android client
publish_to: none
version: 0.5.0+9
environment:
  sdk: ^3.13.5
dependencies:
  bluegrass_client:
    path: ../packages/client
  flutter:
    sdk: flutter
  bluegrass_domain:
    path: ../packages/domain
  bluegrass_data_source:
    path: ../packages/data_source
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
dependency_overrides:
  material_color_utilities: 0.13.1
  test_api: 0.7.15
flutter:
  uses-material-design: true
  assets:
    - assets/branding/wordmark-light.png
    - assets/branding/wordmark-dark.png
    - native/LICENSE.Xray-core
    - native/LICENSE.sing-tun
    - native/LICENSE.sing
