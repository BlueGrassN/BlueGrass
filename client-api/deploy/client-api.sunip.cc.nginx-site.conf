# 仅用于 /www/server/panel/vhost/nginx/client-api.sunip.cc.conf。
# 以下声明放在本文件的 server 块外，不需要修改 nginx.conf。
limit_req_zone $binary_remote_addr zone=client_api_sunip_cc_ip:10m rate=10r/s;
limit_req_zone $server_name zone=client_api_sunip_cc_total:1m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=client_api_sunip_cc_conn_ip:10m;
limit_conn_zone $server_name zone=client_api_sunip_cc_conn_total:1m;
log_format client_api_sunip_cc_safe '$remote_addr [$time_local] "$request_method $uri" '
                                  '$status $body_bytes_sent $request_time';

server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name client-api.sunip.cc;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/client-api.sunip.cc;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/client-api.sunip.cc.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/client-api.sunip.cc/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/client-api.sunip.cc/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/client-api.sunip.cc/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    # 仅对本域名生效的请求限制
    client_max_body_size 4k;
    client_body_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;

    #PHP-INFO-START
    # Go API 不使用 PHP 或缓存清理入口，保留本站反代文件引用。
    include /www/server/panel/vhost/nginx/proxy/client-api.sunip.cc/*.conf;
    # include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START
    # Go API 不使用 PHP 伪静态规则。
    # include /www/server/panel/vhost/rewrite/client-api.sunip.cc.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # 保留原日志路径；访问日志格式不包含查询参数、请求体或鉴权头。
    access_log /www/wwwlogs/client-api.sunip.cc.log client_api_sunip_cc_safe;
    error_log /www/wwwlogs/client-api.sunip.cc.error.log;
}
