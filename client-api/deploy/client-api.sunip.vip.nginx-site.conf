# 仅用于 /www/server/panel/vhost/nginx/client-api.sunip.vip.conf。
# 以下声明放在本文件的 server 块外，不需要修改 nginx.conf。
# 直接使用 EO 提供的客户 IP；没有此头时使用实际连接 IP。
# 此简化配置不验证头部来源，适用于通过 EO 访问的部署。
map $http_eo_connecting_ip $client_api_sunip_vip_client_ip {
    "" $remote_addr;
    default $http_eo_connecting_ip;
}

# 宝塔逐个文件保存时，旧反代仍会引用这两个区域。
# 保留旧 key 和尺寸，先保存本站配置，再保存新的反代配置。
limit_req_zone $binary_remote_addr zone=client_api_sunip_vip_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=client_api_sunip_vip_conn_ip:10m;

# EO 客户 IP 使用新区域，避免改变既有共享内存区域的 key 导致重载失败。
limit_req_zone $client_api_sunip_vip_client_ip zone=client_api_sunip_vip_eo_ip:10m rate=10r/s;
limit_req_zone $server_name zone=client_api_sunip_vip_total:1m rate=50r/s;
limit_conn_zone $client_api_sunip_vip_client_ip zone=client_api_sunip_vip_eo_conn_ip:10m;
limit_conn_zone $server_name zone=client_api_sunip_vip_conn_total:1m;
log_format client_api_sunip_vip_safe '$client_api_sunip_vip_client_ip [$time_local] "$request_method $uri" '
                                  '$status $body_bytes_sent $request_time peer=$remote_addr';

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    listen [::]:80;
    server_name client-api.sunip.vip;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/client-api.sunip.vip;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/client-api.sunip.vip.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/client-api.sunip.vip/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/client-api.sunip.vip/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/client-api.sunip.vip/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    # 登录、刷新令牌等请求会写会话表，禁用可被重放的 TLS 0-RTT 数据。
    # 此设置不关闭 HTTP/3 或正常的 TLS 会话恢复。
    ssl_early_data off;
    error_page 497 https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    # 仅对本域名生效的请求限制
    client_max_body_size 4k;
    client_body_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;

    #PHP-INFO-START
    # Go API 不使用 PHP 或缓存清理入口，保留本站反代文件引用。
    include /www/server/panel/vhost/nginx/proxy/client-api.sunip.vip/*.conf;
    # include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START
    # Go API 不使用 PHP 伪静态规则。
    # include /www/server/panel/vhost/rewrite/client-api.sunip.vip.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # 保留原日志路径；访问日志格式不包含查询参数、请求体或鉴权头。
    access_log /www/wwwlogs/client-api.sunip.vip.log client_api_sunip_vip_safe;
    error_log /www/wwwlogs/client-api.sunip.vip.error.log;
}
